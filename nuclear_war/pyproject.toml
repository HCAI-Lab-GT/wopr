[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuclear-war"
version = "0.1.0"
description = "Deterministic Nuclear War environment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2.0",
    "numpy>=2.3.3",
    "pettingzoo>=1.25.0",
]

[project.scripts]
nuclear-war = "nuclear_war_env.cli:main"

[project.optional-dependencies]
concordia = [
    "gdm-concordia>=2.4.0,<3.0.0",
]
dev = [
    # Self-referential extra: keeps the gdm-concordia pin in one place while
    # ensuring the default dev suite exercises the native Concordia path.
    "nuclear-war[concordia]",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.400",
    "ruff>=0.6.9",
    "pdoc>=15.0.0",
    "trueskill>=0.4.5",
]
silisocs = [
    "silisocs>=0.2.0,<0.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--maxfail=1 --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pdoc]
modules = ["nuclear_war_env"]
output_directory = "build/docs"
